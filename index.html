<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Wi-Fi Share</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; background: #f4f4f9; color: #222; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 16px; }
    button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; background: #0066ff; color: white; font-weight: bold; font-size: 1em; cursor: pointer; }
    button.secondary { background: #333; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    textarea { width: 100%; height: 80px; margin-top: 10px; padding: 8px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; font-family: monospace; font-size: 0.75em; }
    .code-box { background: #eef3ff; padding: 12px; border-radius: 8px; word-break: break-all; font-family: monospace; font-size: 0.75em; max-height: 100px; overflow-y: auto; margin: 10px 0; border: 1px solid #cce0ff; }
    .hidden { display: none; }
    progress { width: 100%; height: 18px; margin-top: 10px; border-radius: 6px; }
    .status-text { font-size: 0.85em; color: #555; margin-top: 4px; }
    #received-list a { display: block; margin: 8px 0; padding: 10px; background: #e8f5e9; color: #2e7d32; text-decoration: none; border-radius: 6px; font-weight: bold; word-break: break-all; }
  </style>
</head>
<body>

  <div class="card" id="setup-card">
    <h3 style="margin-top:0;">Offline Wi-Fi File Share</h3>
    <p style="font-size: 0.9em; color: #555;">Both devices must be connected to the same local Wi-Fi hotspot:</p>
    <button id="host-btn">Device A: Create Connection</button>
    <button id="join-btn" class="secondary">Device B: Join Connection</button>
  </div>

  <div class="card hidden" id="connection-card">
    <h3 id="conn-title">Connection Setup</h3>
    <p id="conn-instruction" style="font-size: 0.9em; color: #555;"></p>
    
    <div id="output-code-container" class="hidden">
      <div class="code-box" id="output-code">Generating...</div>
      <button id="copy-btn" style="background: #16a34a; margin-top: 5px;">Copy Code to Clipboard</button>
    </div>

    <div id="reply-box" class="hidden">
      <p style="font-size: 0.9em; font-weight: bold; margin-top: 15px;">Paste Code from Other Device:</p>
      <textarea id="remote-input" placeholder="Paste code here..."></textarea>
      <button id="connect-confirm-btn">Establish Connection</button>
    </div>
  </div>

  <div class="card hidden" id="transfer-card">
    <h3 style="color: #16a34a; margin-top: 0;">● Connected Locally</h3>
    <input type="file" id="file-input" multiple style="width: 100%; margin-bottom: 10px;">
    <button id="send-btn">Send Selected Files</button>
    
    <div id="send-progress-box" class="hidden">
      <progress id="send-progress" value="0" max="100"></progress>
      <div class="status-text" id="send-status">Sending...</div>
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <h4 style="margin-bottom: 8px;">Received Files</h4>
    <div id="receive-progress-box" class="hidden">
      <progress id="receive-progress" value="0" max="100"></progress>
      <div class="status-text" id="receive-status">Receiving...</div>
    </div>
    <div id="received-list">Waiting for files...</div>
  </div>

  <script>
    const pc = new RTCPeerConnection({ iceServers: [] });
    let dataChannel = null;
    let isInitiator = false;
    const CHUNK_SIZE = 16384;

    const setupCard = document.getElementById('setup-card');
    const connCard = document.getElementById('connection-card');
    const transferCard = document.getElementById('transfer-card');
    const connTitle = document.getElementById('conn-title');
    const connInstruction = document.getElementById('conn-instruction');
    const outputCodeContainer = document.getElementById('output-code-container');
    const outputCode = document.getElementById('output-code');
    const replyBox = document.getElementById('reply-box');

    function setupDataChannel(channel) {
      dataChannel = channel;
      dataChannel.binaryType = 'arraybuffer';
      dataChannel.bufferedAmountLowThreshold = 65536;

      dataChannel.onopen = () => {
        connCard.classList.add('hidden');
        transferCard.classList.remove('hidden');
      };

      let incomingMeta = null;
      let receiveBuffer = [];
      let receivedBytes = 0;

      const recBox = document.getElementById('receive-progress-box');
      const recBar = document.getElementById('receive-progress');
      const recStatus = document.getElementById('receive-status');

      dataChannel.onmessage = (event) => {
        if (typeof event.data === 'string') {
          const msg = JSON.parse(event.data);
          if (msg.type === 'meta') {
            incomingMeta = msg;
            receiveBuffer = [];
            receivedBytes = 0;
            recBox.classList.remove('hidden');
            recBar.value = 0;
            recStatus.textContent = `Receiving ${msg.name}... 0%`;
          } else if (msg.type === 'eof' && incomingMeta) {
            const blob = new Blob(receiveBuffer, { type: incomingMeta.fileType });
            const url = URL.createObjectURL(blob);
            const list = document.getElementById('received-list');
            if (list.textContent === 'Waiting for files...') list.innerHTML = '';

            const a = document.createElement('a');
            a.href = url;
            a.download = incomingMeta.name;
            const sizeMB = (incomingMeta.size / (1024 * 1024)).toFixed(2);
            a.textContent = `Download: ${incomingMeta.name} (${sizeMB} MB)`;
            list.appendChild(a);

            recBox.classList.add('hidden');
            receiveBuffer = [];
            incomingMeta = null;
          }
          return;
        }

        if (incomingMeta) {
          receiveBuffer.push(event.data);
          receivedBytes += event.data.byteLength;
          const pct = Math.min(100, Math.round((receivedBytes / incomingMeta.size) * 100));
          recBar.value = pct;
          recStatus.textContent = `Receiving ${incomingMeta.name}... ${pct}%`;
        }
      };
    }

    // Device A Flow
    document.getElementById('host-btn').addEventListener('click', async () => {
      isInitiator = true;
      setupCard.classList.add('hidden');
      connCard.classList.remove('hidden');
      connTitle.textContent = "Step 1: Device A Code";
      connInstruction.textContent = "Copy this code and give it to Device B:";

      const channel = pc.createDataChannel("file-transfer");
      setupDataChannel(channel);

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      outputCode.textContent = JSON.stringify({ type: pc.localDescription.type, sdp: pc.localDescription.sdp });
      outputCodeContainer.classList.remove('hidden');
      replyBox.classList.remove('hidden');
    });

    // Device B Flow
    document.getElementById('join-btn').addEventListener('click', () => {
      isInitiator = false;
      setupCard.classList.add('hidden');
      connCard.classList.remove('hidden');
      connTitle.textContent = "Step 1: Device B Join";
      connInstruction.textContent = "Paste Device A's code below, then copy the reply code:";

      replyBox.classList.remove('hidden');
      document.getElementById('remote-input').placeholder = "Paste Device A code here...";

      pc.ondatachannel = (event) => setupDataChannel(event.channel);
    });

    // Copy Button Handler
    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(outputCode.textContent).then(() => {
        document.getElementById('copy-btn').textContent = "Copied!";
        setTimeout(() => document.getElementById('copy-btn').textContent = "Copy Code to Clipboard", 2000);
      });
    });

    // Confirm / Establish Connection Handler
    document.getElementById('connect-confirm-btn').addEventListener('click', async () => {
      try {
        const raw = document.getElementById('remote-input').value;
        // Automatically remove all line breaks and whitespace that mobile copy-pasting adds
        const cleaned = raw.replace(/[\r\n\s]+/g, ' ').trim();
        const parsed = JSON.parse(cleaned);

        if (!isInitiator && parsed.type === 'offer') {
          // Device B processes offer and generates answer
          await pc.setRemoteDescription(new RTCSessionDescription({ type: parsed.type, sdp: parsed.sdp }));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          connTitle.textContent = "Step 2: Copy Reply Code";
          connInstruction.textContent = "Copy this reply code and send it back to Device A:";
          
          outputCode.textContent = JSON.stringify({ type: pc.localDescription.type, sdp: pc.localDescription.sdp });
          outputCodeContainer.classList.remove('hidden');
          document.getElementById('remote-input').value = "";
          document.getElementById('remote-input').placeholder = "Waiting for connection...";
        } else if (isInitiator && parsed.type === 'answer') {
          // Device A processes answer
          await pc.setRemoteDescription(new RTCSessionDescription({ type: parsed.type, sdp: parsed.sdp }));
        }
      } catch (err) {
        alert("Formatting error. Make sure you copied and pasted the entire text cleanly without cutting off characters.");
      }
    });

    // File Transfer Handler
    document.getElementById('send-btn').addEventListener('click', async () => {
      const files = document.getElementById('file-input').files;
      if (!files.length || !dataChannel || dataChannel.readyState !== 'open') return;

      const sendBtn = document.getElementById('send-btn');
      const sendBox = document.getElementById('send-progress-box');
      const sendBar = document.getElementById('send-progress');
      const sendStatus = document.getElementById('send-status');

      sendBtn.disabled = true;
      sendBox.classList.remove('hidden');

      for (const file of files) {
        dataChannel.send(JSON.stringify({ type: 'meta', name: file.name, size: file.size, fileType: file.type }));

        let offset = 0;
        while (offset < file.size) {
          if (dataChannel.bufferedAmount > 262144) {
            await new Promise((resolve) => {
              dataChannel.onbufferedamountlow = () => {
                dataChannel.onbufferedamountlow = null;
                resolve();
              };
            });
          }

          const slice = file.slice(offset, offset + CHUNK_SIZE);
          const buffer = await slice.arrayBuffer();
          dataChannel.send(buffer);
          offset += buffer.byteLength;

          const pct = Math.min(100, Math.round((offset / file.size) * 100));
          sendBar.value = pct;
          sendStatus.textContent = `Sending ${file.name}... ${pct%}`;
        }

        dataChannel.send(JSON.stringify({ type: 'eof' }));
      }

      sendStatus.textContent = 'All files sent!';
      sendBtn.disabled = false;
      setTimeout(() => sendBox.classList.add('hidden'), 3000);
    });
  </script>
</body>
</html>
